<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loading a flock with inputs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#2B3440}
a{color:#7DD3FC}a:hover{color:#BAE6FD}
</style>
</helmet>
<div style="width: 380px; height: 600px; box-sizing: border-box; padding: 20px; background: #2B3440; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #E6EDF3">
  <div style="box-sizing: border-box; width: 340px; padding: 10px 12px 12px; border: 1px solid #7DD3FC; border-radius: 10px; background: #0D1218; display: flex; flex-direction: column; gap: 10px">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <span style="font-size: 13px; font-weight: 600">2 columns · no windows yet</span>
      <div style="display: flex; gap: 2px; color: #C9D3DC">
        <button type="button" aria-label="Undo" style="width: 30px; height: 30px; border: 0; border-radius: 6px; background: transparent; color: #5B6673; display: flex; align-items: center; justify-content: center">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3L2 6l3 3"></path><path d="M2 6h8a4 4 0 010 8H7"></path></svg>
        </button>
        <button type="button" aria-label="Redo" style="width: 30px; height: 30px; border: 0; border-radius: 6px; background: transparent; color: #5B6673; display: flex; align-items: center; justify-content: center">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 3l3 3-3 3"></path><path d="M14 6H6a4 4 0 000 8h3"></path></svg>
        </button>
        <button type="button" aria-label="Settings" style="width: 30px; height: 30px; border: 0; border-radius: 6px; background: transparent; color: #C9D3DC; display: flex; align-items: center; justify-content: center">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="2.2"></circle><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"></path></svg>
        </button>
      </div>
    </div>

    <div style="opacity: 0.4; display: flex; flex-direction: column; gap: 6px" aria-hidden="true">
      <span style="color: #8B98A5; font-size: 11px">Layout · Splits · Frame · Windows</span>
      <div style="display: flex; gap: 4px">
        <span style="width: 48px; height: 30px; border-radius: 4px; border: 1px solid #7DD3FC; background: #1C3A4A"></span>
        <span style="width: 48px; height: 30px; border-radius: 4px; border: 1px solid #3A4450"></span>
        <span style="width: 48px; height: 30px; border-radius: 4px; border: 1px solid #3A4450"></span>
        <span style="width: 48px; height: 30px; border-radius: 4px; border: 1px solid #3A4450"></span>
        <span style="width: 48px; height: 30px; border-radius: 4px; border: 1px solid #3A4450"></span>
      </div>
    </div>

    <div style="height: 1px; background: #1E262F"></div>

    <span style="color: #8B98A5; font-size: 11px">Flock</span>
    <div style="font-size: 13px; font-weight: 600">Load “Flamingle dev”</div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="lp-worktree" style="color: #8B98A5; font-size: 12px">Worktree</label>
      <div style="display: flex; gap: 4px">
        <input id="lp-worktree" value="C:\src\flamingle-saved-flocks" style="flex: 1 1 auto; min-width: 0; box-sizing: border-box; height: 30px; padding: 4px 8px; border: 1px solid #7DD3FC; border-radius: 6px; background: #0B0F14; color: #E6EDF3; font: 12px 'IBM Plex Mono', monospace">
        <button type="button" style="height: 30px; padding: 0 10px; border: 1px solid #2A333D; border-radius: 6px; background: #1E262F; color: #E6EDF3; font: 500 12px 'IBM Plex Sans', sans-serif">Browse…</button>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 4px">
        <button type="button" style="height: 24px; padding: 0 8px; border: 1px solid #2A333D; border-radius: 999px; background: #11161C; color: #C9D3DC; font: 11px 'IBM Plex Mono', monospace">flamingle</button>
        <button type="button" style="height: 24px; padding: 0 8px; border: 1px solid #7DD3FC; border-radius: 999px; background: #12303D; color: #7DD3FC; font: 11px 'IBM Plex Mono', monospace">flamingle-saved-flocks</button>
        <button type="button" style="height: 24px; padding: 0 8px; border: 1px solid #2A333D; border-radius: 999px; background: #11161C; color: #C9D3DC; font: 11px 'IBM Plex Mono', monospace">flamingle-relaunch</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="color: #8B98A5; font-size: 12px">Branch <span style="color: #5B6673">· from git</span></span>
      <div style="height: 30px; box-sizing: border-box; padding: 5px 8px; border: 1px solid #1E262F; border-radius: 6px; background: #11161C; color: #C9D3DC; font: 12px 'IBM Plex Mono', monospace">saved-flocks</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="lp-port" style="color: #8B98A5; font-size: 12px">Dev server port</label>
      <input id="lp-port" value="5174" style="width: 90px; box-sizing: border-box; height: 30px; padding: 4px 8px; border: 1px solid #2A333D; border-radius: 6px; background: #0B0F14; color: #E6EDF3; font: 12px 'IBM Plex Mono', monospace">
    </div>

    <div style="padding: 8px 10px; border-radius: 6px; background: #11161C; color: #C9D3DC; font-size: 12px; line-height: 1.5">
      Starts <b style="font-weight: 600; color: #E6EDF3">Visual Studio Code</b> and <b style="font-weight: 600; color: #E6EDF3">Windows Terminal</b>; uses the open <b style="font-weight: 600; color: #E6EDF3">Edge</b> window on localhost:5174.
    </div>

    <div style="display: flex; gap: 4px">
      <button type="button" style="height: 30px; padding: 0 14px; border: 1px solid #7DD3FC; border-radius: 6px; background: #7DD3FC; color: #0B1220; font: 600 12px 'IBM Plex Sans', sans-serif">Load</button>
      <button type="button" style="height: 30px; padding: 0 12px; border: 1px solid #2A333D; border-radius: 6px; background: #1E262F; color: #E6EDF3; font: 500 12px 'IBM Plex Sans', sans-serif">Cancel</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":380,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
